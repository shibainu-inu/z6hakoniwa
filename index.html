<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#16151c;--muted:#55525e;--dim:#8b8794;--line:#eae6db;--soft:#f9f7f2;--accent:#8b6cf6;
--good:#2fbf71;--mid:#ffc933;--bad:#d9434b;--meal:#ff8a3d;--out:#1fb5a8;--play:#ff6fb1;--room:#1d1c22;--shadow:0 1px 2px rgba(22,21,28,.06),0 8px 24px rgba(22,21,28,.06);
--r-wall:#f7f4ee;--r-floor:#ece7dc;--r-edge:#ddd6c8;--r-ink:#16151c;--r-dim:#a8a296;--r-in:#fff;--r-pale:#16151c;--r-shade:rgba(22,21,28,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121116;--card:#1c1b22;--ink:#f4f1ea;--muted:#b8b4c2;--dim:#8b8794;--line:#2c2a33;--soft:#17161c;--room:#0d0c10;--shadow:none;--r-wall:#1a1a1a;--r-floor:#242424;--r-edge:#2e2e2e;--r-ink:#f0ede6;--r-dim:#6e6a63;--r-in:#1a1a1a;--r-pale:#f0ede6;--r-shade:rgba(0,0,0,.45)}}
:root[data-theme=dark]{--bg:#121116;--card:#1c1b22;--ink:#f4f1ea;--muted:#b8b4c2;--dim:#8b8794;--line:#2c2a33;--soft:#17161c;--room:#0d0c10;--shadow:none;--r-wall:#1a1a1a;--r-floor:#242424;--r-edge:#2e2e2e;--r-ink:#f0ede6;--r-dim:#6e6a63;--r-in:#1a1a1a;--r-pale:#f0ede6;--r-shade:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Bricolage Grotesque","M PLUS Rounded 1c",ui-sans-serif,system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-feature-settings:"tnum"}
a{color:inherit}
button{font:inherit;cursor:pointer}
/* 上 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.brand .mark svg{display:block;width:24px;height:auto}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.pills{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.pills a{padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.pills a.on{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,var(--line))}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip[hidden]{display:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.chip.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.icon.lang{font-size:12px;font-weight:700;letter-spacing:.02em}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
/* ティッカー */
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.ticker .track{display:inline-flex;gap:28px;padding:8px 0;animation:tick 150s linear infinite}
.ticker .item{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ticker .item svg{width:18px;height:auto;image-rendering:pixelated}
.up{color:var(--good)}.down{color:var(--bad)}.muted{color:var(--muted)}.dim{color:var(--dim)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* 並び */
#moving{grid-column:1/-1;border:2px solid var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;max-width:1180px;margin:0 auto;padding:20px}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:14px 14px 20px}.pills{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.label{font:600 11px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 8px}
/* HAKO の窓 */
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--r-wall);border:1px solid var(--line);container-type:inline-size}
.stage .bg svg{display:block;width:100%;height:auto}
.stage .pos{position:absolute;z-index:1}
.stage .pos svg{display:block;width:100%;height:auto}
.stage.plain{height:190px;display:flex;align-items:center;justify-content:center;background:var(--r-wall)}
.stage.plain svg{display:block}
.stage.plain.short{height:120px}
/* ひとこと: HAKO の頭の上に、小さく決まった大きさで出す（2 行まで。HAKO を隠さない）。喋るときだけ見える */
.stage .say{position:absolute;left:50%;bottom:118%;width:max-content;max-width:min(64cqw,240px);background:#fff;color:#16151c;border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:12.5px;font-weight:600;line-height:1.4;text-align:center;box-shadow:0 4px 14px rgba(22,21,28,.12);pointer-events:none;opacity:0;transform:translateX(-50%) translateY(5px) scale(.94);transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.4,.4,1)}
.stage .say.on{opacity:1;transform:translateX(-50%)}
.stage .say span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stage .say small{display:block;margin-top:1px;font-size:10.5px;font-weight:500;color:#6e6a63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .say::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.stage .pos svg.bowl{position:absolute;left:108%;bottom:-2%;width:40%;height:auto}
/* 動き（D-112）: ドット絵のまま、伸び縮み・影・粒で作り込む。ゆっくり */
.pos .shadow{position:absolute;left:6%;right:6%;bottom:-4%;height:10%;border-radius:50%;background:var(--r-shade);animation:shade 5s ease-in-out infinite}
.hako{position:relative;transform-origin:50% 100%;animation:breathe 5s cubic-bezier(.37,0,.63,1) infinite}
.m-normal .hako,.m-happy .hako,.m-normal .shadow,.m-happy .shadow{animation:none}   /* 通常と喜ぶは tama_app.js が 1 回ずつ動かす（呼吸のゆらぎと跳ね） */
.m-sad .hako{animation:droop 7s ease-in-out infinite;filter:saturate(.55)}
.m-eat .hako{animation:chew 1.1s ease-in-out infinite}
.egg,.m-reborn .hako{transform-origin:50% 100%;animation:rock 3.6s ease-in-out infinite}
.m-normal.s-egg .hako{animation:rock-rest 5s ease-in-out infinite}
.ghost{opacity:.8;animation:drift 9s ease-in-out infinite}
.fx{position:absolute;left:0;right:0;bottom:100%;height:0;pointer-events:none}
.fx i{position:absolute;bottom:0;width:16%;aspect-ratio:7/6;opacity:0;background:var(--play);clip-path:polygon(14% 0,43% 0,43% 17%,57% 17%,57% 0,86% 0,86% 17%,100% 17%,100% 50%,86% 50%,86% 67%,71% 67%,71% 83%,57% 83%,57% 100%,43% 100%,43% 83%,29% 83%,29% 67%,14% 67%,14% 50%,0 50%,0 17%,14% 17%);animation:float 2.6s ease-out infinite}
.fx i:nth-child(1){left:8%}.fx i:nth-child(2){left:44%;animation-delay:.9s}.fx i:nth-child(3){left:78%;animation-delay:1.7s}
.fx.steam{left:108%;right:auto;width:40%;bottom:24%}.fx.steam i{width:12%;aspect-ratio:1;clip-path:none;background:var(--r-dim);animation:float 2.2s ease-out infinite}
.fx.steam i:nth-child(1){left:24%}.fx.steam i:nth-child(2){left:58%;animation-delay:1.1s}
.fx.drop i{left:82%;width:9%;aspect-ratio:1/2;clip-path:none;background:#6fc9dc;animation:fall 3.4s ease-in infinite}
.stage .glow{transform-box:fill-box;transform-origin:center;animation:glow 5.5s ease-in-out infinite}
.stage .hako svg{overflow:visible}
.stage .hako .halo{transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-in-out infinite}
.stage .hako .spark,.stage .hako .gold{filter:drop-shadow(0 0 2px #fff1a8)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stage .hako .halo{animation-name:halo-dark}}
:root[data-theme=dark] .stage .hako .halo{animation-name:halo-dark}
.stage .hako .spark{animation:twinkle 1.8s steps(1,end) infinite}
.stage .hako .gold{animation:gold 2.4s ease-in-out infinite}
.stage .mote{position:absolute;width:.9cqw;height:.9cqw;background:var(--r-dim);opacity:0;animation:mote 16s linear infinite}
.stage .ops{position:absolute;z-index:1;left:10px;right:10px;bottom:8px;display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.5;color:var(--r-dim);pointer-events:none;white-space:nowrap;overflow:hidden}
.stage .ops span{overflow:hidden;text-overflow:ellipsis;animation:type .7s steps(28) both}.stage .ops span.old{opacity:.45;animation:none}
.wait{display:flex;align-items:center;gap:10px;margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--muted)}
.wait .track{position:relative;display:inline-flex;gap:12px;padding:12px 2px 0}
.wait .track i{width:8px;height:8px;background:var(--line);transition:background .4s}
.wait .track i.done{background:var(--accent)}.wait .track i.now{background:color-mix(in srgb,var(--accent) 45%,var(--line));animation:pip 1.4s ease-in-out infinite}
.wait .coin{position:absolute;left:calc(2px + var(--s) * 20px);bottom:9px;width:8px;height:8px;background:var(--mid);box-shadow:0 0 0 1.5px var(--ink);transition:left .7s cubic-bezier(.3,1.4,.5,1);animation:coin 1.4s cubic-bezier(.4,0,.4,1) infinite}
.wait .dots{display:inline-flex;gap:3px}.wait .dots i{width:4px;height:4px;background:var(--dim);animation:wave 1.4s ease-in-out infinite}.wait .dots i:nth-child(2){animation-delay:.18s}.wait .dots i:nth-child(3){animation-delay:.36s}
@keyframes type{from{max-width:0}to{max-width:100%}}
@keyframes pip{50%{transform:scale(1.25,.8)}}
@keyframes coin{0%,100%{transform:translateY(0) scaleX(1)}30%{transform:translateY(-9px) scaleX(.15)}50%{transform:translateY(-12px) scaleX(1)}70%{transform:translateY(-9px) scaleX(.15)}}
@keyframes wave{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.hint{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.roominfo{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.away{position:absolute;z-index:1;left:0;right:0;top:30%;text-align:center;color:var(--muted);font-weight:700;font-size:13px}.away svg{display:inline-block}.away p{margin:4px 0 0}.away .sign{width:9cqw;height:auto}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.035)}}
@keyframes shade{50%{transform:scaleX(.95);opacity:.85}}
@keyframes droop{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.92) rotate(-3deg)}}
@keyframes chew{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.93)}}
@keyframes rock{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes rock-rest{0%,55%,100%{transform:rotate(0)}64%{transform:rotate(-8deg)}74%{transform:rotate(7deg)}84%{transform:rotate(-4deg)}93%{transform:rotate(2deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.8}50%{transform:translate(8%,-9%);opacity:.62}}
@keyframes float{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-190%) scale(1)}}
@keyframes fall{0%,55%{opacity:0;transform:translateY(-420%)}65%{opacity:1}100%{opacity:0;transform:translateY(-120%)}}
@keyframes glow{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.3;transform:scale(1.08)}}
@keyframes halo{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.75;transform:scale(1.1)}}
@keyframes halo-dark{0%,100%{opacity:.08;transform:scale(.9)}50%{opacity:.22;transform:scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:0}12%,40%{opacity:1}}
@keyframes gold{50%{opacity:.55}}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.5}85%{opacity:.35}100%{opacity:0;transform:translate(6cqw,-14cqw)}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleY(.3);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* 名前・メーター・チップ */
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.who .name{font-weight:800;font-size:18px}
.who .name{min-width:0;overflow-wrap:anywhere}.who .name .sub{font-weight:400;font-size:13px;color:var(--dim)}
.rename{margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;width:28px;height:28px;font-size:14px;line-height:1;cursor:pointer;vertical-align:2px}
.rename[aria-expanded=true]{background:var(--soft);color:var(--ink)}
.namef{margin:0 0 12px}.namef .actions{margin-top:8px}
.sitf{margin:4px 0 12px}.sitf .actions{margin-top:8px}.sit{margin:8px 0 4px;padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}.sit p{margin:0}.sit p+p,.sit p+.actions,.sit p+form{margin-top:6px}
select{display:block;width:100%;font:inherit;padding:10px 12px;margin-top:4px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.state{font-size:12px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:5px}
.bar i{height:10px;border-radius:3px;background:var(--line)}
.bar.good i.on{background:var(--good)}.bar.mid i.on{background:var(--mid)}.bar.bad i.on{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* ボタン */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--c,var(--accent)) 42%,var(--line));background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--card));color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px}
.btn .dot{width:10px;height:10px;border-radius:50%}
.btn.sub{background:var(--card);color:var(--ink);border-color:var(--line)}
